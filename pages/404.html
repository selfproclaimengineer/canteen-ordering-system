<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesan Kantin</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 600 18px/1.4 system-ui, sans-serif; color: #111; text-align: center; padding: 16px; box-sizing: border-box; }
  small { display: block; margin-top: 8px; font-weight: 400; color: #555; }
</style>
</head>
<body>
<div id="pesan">Membuka menu kantin…</div>
<script>
  // Static QR: .../pesan/<kode>. alamat.json holds the current server address, encrypted with the QR code
  // (written by server/umumkan.ts on the host phone). Wait until the server answers, then go there.
  const tulis = (t, kecil) => { document.getElementById('pesan').innerHTML = t + (kecil ? '<small>' + kecil + '</small>' : ''); };
  const m = location.pathname.match(/\/pesan\/([A-Za-z0-9]+)\/?$/);
  // Static staff links: .../staf/<kode>/order or .../staf/<kode>/dapur (address in alamat.json, field staf).
  const s = location.pathname.match(/\/staf\/([A-Za-z0-9]+)\/(order|dapur)\/?$/);
  const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const tunggu = (ms) => new Promise((r) => setTimeout(r, ms));

  // GitHub Pages serves a copy that can be up to 10 minutes old (its cache ignores ?t=). The GitHub API is at
  // most 1 minute old but allows only 60 requests per hour per network, so it is the fallback, at most every 30 s.
  const API = 'https://api.github.com/repos/selfproclaimengineer/canteen-ordering-system/contents/alamat.json?ref=gh-pages';
  let apiTerakhir = 0;
  async function ambilJson(base, segar) {
    if (segar && Date.now() - apiTerakhir > 30000) {
      apiTerakhir = Date.now();
      const r = await fetch(API, { cache: 'no-store', headers: { Accept: 'application/vnd.github.raw+json' } });
      if (r.ok) return r.json();
    }
    const r = await fetch(base + 'alamat.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('belum ada');
    return r.json();
  }

  async function alamat(kode, base, segar, staf) {
    const semua = await ambilJson(base, segar);
    // Servers older than v7 still write the staff address to its own staf.json.
    const j = staf ? semua.staf ?? (await fetch(base + 'staf.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null))) : semua;
    if (!j) throw new Error('link staf belum diumumkan');
    const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kantin-qr:' + kode));
    const kunci = await crypto.subtle.importKey('raw', hash, 'AES-GCM', false, ['decrypt']);
    const isi = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(j.iv) }, kunci, u8(j.data));
    return JSON.parse(new TextDecoder().decode(isi)).alamat;
  }

  async function jalan(kode) {
    for (let coba = 0; ; coba++) {
      try {
        const a = await alamat(kode, '../', coba > 0, false);
        const r = await fetch(a + '/api/qr/' + kode + '/info', { signal: AbortSignal.timeout(8000) });
        if (r.ok) return location.replace(a + '/pesan/' + kode);
        if (r.status === 404) return tulis('Pemesanan lewat QR sedang tidak aktif.', 'Silakan pesan di meja kantin.');
      } catch (e) {
        // Server off, starting up, or the address is still being published.
      }
      tulis('Server kantin sedang dinyalakan…', 'Halaman ini mencoba lagi sendiri. Tunggu sebentar.');
      await tunggu(5000);
    }
  }

  async function jalanStaf(kode, layar) {
    for (let coba = 0; ; coba++) {
      try {
        const a = await alamat(kode, '../../', coba > 0, true);
        const r = await fetch(a + '/api/menu', { signal: AbortSignal.timeout(8000) });
        // kembali: the app returns here by itself when the tunnel address changes.
        if (r.ok) return location.replace(a + '/' + layar + '?kembali=' + encodeURIComponent(location.href));
      } catch (e) {
        // Server off, starting up, address not published yet, or a wrong link.
      }
      tulis('Server kantin sedang dinyalakan…', 'Halaman ini mencoba lagi sendiri. Kalau lebih dari 5 menit, cek HP server.');
      await tunggu(5000);
    }
  }

  if (m) jalan(m[1]);
  else if (s) jalanStaf(s[1], s[2]);
  else tulis('QR tidak dikenal.', 'Scan QR yang ada di meja kantin.');
</script>
</body>
</html>
